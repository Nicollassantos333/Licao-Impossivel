<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}API Lição Impossível{% endblock %}</title>
    <style>
        /* Reset de Estilos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #030712;
            color: #e2e8f0;
            display: flex;
        }

        /* Sidebar Fixa na Esquerda */
        .sidebar {
            width: 260px;
            height: 100vh;
            background-color: #0b1329;
            position: fixed;
            padding: 20px;
            border-right: 2px solid #1c2541;
            overflow-y: auto;
        }

        .sidebar h2, .sidebar h3 {
            margin-bottom: 10px;
        }

        .sidebar a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #1c2541;
            color: #00b4d8;
        }

        /* Área de Conteúdo na Direita */
        .main-content {
            margin-left: 260px;
            padding: 40px;
            width: calc(100% - 260px);
        }

        .section {
            margin-bottom: 40px;
            background-color: #0b1329;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #1c2541;
        }

        h1, h3 {
            color: #00b4d8;
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        code {
            color: #00d4ff;
            font-weight: bold;
        }

        /* Código JSON */
        pre {
            background-color: #010409;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid #1c2541;
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.6;
        }

        /* Tabelas */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #1c2541;
        }

        th {
            color: #00b4d8;
            background-color: #1c2541;
        }

        td {
            color: #e2e8f0;
        }

        /* Badges HTTP */
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 8px;
        }

        .get { 
            background-color: #0e6251; 
            color: #2ecc71; 
        }

        .post { 
            background-color: #78281f; 
            color: #e74c3c; 
        }

        .put { 
            background-color: #7e5109; 
            color: #f39c12; 
        }

        .delete {
            background-color: #4a0d0d;
            color: #ff6b6b;
        }
    </style>
</head>
<body>

    <!-- Sidebar de Navegação -->
    <div class="sidebar">
        <h2 style="color: #4ade80; font-size: 1.4rem; margin-bottom: 5px;">🚀 Lição Impossível</h2>
        <h3 style="color: #00b4d8; font-size: 1.2rem; margin-bottom: 30px; font-weight:bold;">
            Impossible API 🐧
        </h3>

        <a href="#register">👤 Cadastro de Usuário</a>
        <a href="#login">🔐 Login</a>
        <a href="#profile">🙍 Visualizar Perfil</a>
        <a href="#list-users">📋 Listar Usuários</a>
        <a href="#equipe">👥 Developers</a>
    </div>

    <!-- Conteúdo -->
    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
